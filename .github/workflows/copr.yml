name: Fedora Copr Build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copr-build:
    name: Build SRPM & Submit to Copr
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install build tools and copr-cli
        run: |
          dnf install -y git tar rpm-build rpmdevtools cargo-rpm-macros copr-cli

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Source RPM (SRPM)
        id: build_srpm
        run: |
          VERSION=$(awk '/^Version:/ {print $2; exit}' packaging/rpm/appnest.spec)
          NAME="appnest"
          echo "Building SRPM for ${NAME} v${VERSION}..."

          mkdir -p "${HOME}/rpmbuild/SOURCES" "${HOME}/rpmbuild/SPECS" "${HOME}/rpmbuild/SRPMS"

          # GitHub names the top-level directory after the repository (Appnest-VERSION)
          git archive --format=tar.gz --prefix="Appnest-${VERSION}/" \
            -o "${HOME}/rpmbuild/SOURCES/${NAME}-${VERSION}.tar.gz" HEAD

          cp "packaging/rpm/${NAME}.spec" "${HOME}/rpmbuild/SPECS/${NAME}.spec"
          rpmbuild -bs "${HOME}/rpmbuild/SPECS/${NAME}.spec"

          SRPM_FILE=$(find "${HOME}/rpmbuild/SRPMS" -name "${NAME}-${VERSION}-*.src.rpm" | head -n 1)
          mkdir -p dist
          cp "${SRPM_FILE}" dist/
          echo "srpm_path=dist/$(basename "${SRPM_FILE}")" >> "$GITHUB_OUTPUT"
          echo "srpm_name=$(basename "${SRPM_FILE}")" >> "$GITHUB_OUTPUT"
          echo "::notice title=SRPM::Built $(basename "${SRPM_FILE}")"

      - name: Upload SRPM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build_srpm.outputs.srpm_name }}
          path: ${{ steps.build_srpm.outputs.srpm_path }}
          if-no-files-found: error

      - name: Submit to Fedora Copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "${COPR_CONFIG}" ]; then
            echo "::warning title=Copr submission skipped::The COPR_CONFIG secret is not set, so nothing was submitted to Copr. The SRPM was built and attached as an artifact."
            exit 0
          fi

          umask 077
          mkdir -p ~/.config
          printf '%s\n' "${COPR_CONFIG}" > ~/.config/copr

          # --nowait only submits the build. Whether Copr's build itself succeeds is reported
          # on the Copr project page (kailaz/appnest), not by this workflow.
          copr-cli build --nowait kailaz/appnest "${{ steps.build_srpm.outputs.srpm_path }}"
          echo "::notice title=Copr build submitted::The build was submitted to kailaz/appnest. Check the Copr project for its result."
