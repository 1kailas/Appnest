name: CI & Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, Test & Validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            desktop-file-utils \
            appstream \
            p7zip-full

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Code Formatting
        run: cargo fmt --check

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --verbose

      - name: Validate Desktop Entry
        run: desktop-file-validate packaging/io.github._1kailas.AppNest.desktop

      - name: Validate AppStream Metainfo
        run: appstreamcli validate --no-net resources/io.github._1kailas.AppNest.metainfo.xml
