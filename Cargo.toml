[package]
name = "appnest"
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
authors = ["1kailas"]
license = "GPL-3.0-or-later"
description = "A clean, modern AppImage manager built with Rust, GTK4, and Libadwaita"
repository = "https://github.com/1kailas/Appnest"
readme = "README.md"
keywords = ["appimage", "package-manager", "gtk4", "libadwaita", "gnome"]
categories = ["gui", "os::linux-apis"]

[dependencies]
libadwaita = { version = "0.9", features = ["v1_5"] }
gtk4 = { version = "0.11", features = ["v4_6"] }
gio = "0.22"
glib = "0.22"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
thiserror = "2.0"
directories = "6.0"
walkdir = "2.5"
tempfile = "3.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2.3"
libc = "0.2"
sha2 = "0.11"
