[package]
name = "appnest"
version = "0.1.0"
edition = "2021"
authors = ["1kailas"]
license = "GPL-3.0-or-later"
description = "A clean, modern AppImage manager built with Rust, GTK4, and Libadwaita"
homepage = "https://github.com/1kailas/appnest"
repository = "https://github.com/1kailas/appnest"
readme = "README.md"
keywords = ["appimage", "package-manager", "gtk4", "libadwaita", "gnome"]
categories = ["gui", "os::linux-apis"]

[dependencies]
libadwaita = { version = "0.9", features = ["v1_5"] }
gtk4 = { version = "0.11", features = ["v4_6"] }
gio = "0.22"
glib = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
directories = "5.0"
walkdir = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
tempfile = "3.12"
infer = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2.3"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/appnest", dest = "/usr/bin/appnest", mode = "755" },
    { source = "resources/icons/io.github._1kailas.AppNest.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github._1kailas.AppNest.svg", mode = "644" },
    { source = "packaging/io.github._1kailas.AppNest.desktop", dest = "/usr/share/applications/io.github._1kailas.AppNest.desktop", mode = "644" },
    { source = "resources/io.github._1kailas.AppNest.metainfo.xml", dest = "/usr/share/metainfo/io.github._1kailas.AppNest.metainfo.xml", mode = "644" }
]
